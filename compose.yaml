services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_DB: foodoo_order
      POSTGRES_USER: foodoo
      POSTGRES_PASSWORD: foodoo_dev_password
    ports:
      - "5432:5432"
    volumes:
      - order-postgres-data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foodoo -d foodoo_order"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  order-migrate:
    image: migrate/migrate:v4.18.3
    volumes:
      - ./services/order/migrations:/migrations:ro
    command:
      [
        "-path=/migrations",
        "-database=postgres://foodoo:foodoo_dev_password@postgres:5432/foodoo_order?sslmode=disable",
        "up",
      ]
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  order-api:
    build:
      context: ./services/order
    environment:
      HTTP_ADDR: ":8080"
      DATABASE_URL: postgres://foodoo:foodoo_dev_password@postgres:5432/foodoo_order?sslmode=disable
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      order-migrate:
        condition: service_completed_successfully

volumes:
  order-postgres-data:
